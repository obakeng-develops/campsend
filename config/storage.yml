test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

alternate_test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage-alternate") %>

# Answers the S3 API offline, so multipart upload is testable without network
# or credentials. Used only by the test suite.
s3_test:
  service: S3
  bucket: campsend-test
  region: us-east-1
  access_key_id: stub
  secret_access_key: stub
  stub_responses: true

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

s3:
  service: S3
  endpoint: <%= ENV["STORAGE_ENDPOINT"] %>
  access_key_id: <%= ENV["STORAGE_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["STORAGE_SECRET_ACCESS_KEY"] %>
  region: <%= ENV.fetch("STORAGE_REGION", "us-east-1") %>
  bucket: <%= ENV["STORAGE_BUCKET"] %>
  force_path_style: <%= ENV.fetch("STORAGE_FORCE_PATH_STYLE", "false") == "true" %>
  public: false
